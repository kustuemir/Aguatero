<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Aguatero</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #f4f1ea; color: #1a2b3c; min-height: 100vh; }
    #pantallaLogin { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { background: white; border-radius: 16px; padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .login-card h1 { text-align: center; font-size: 1.4em; color: #0b3d5c; margin-bottom: 4px; }
    .login-card p { text-align: center; font-size: 0.85em; color: #666; margin-bottom: 20px; }
    label { display: block; font-size: 0.85em; font-weight: 600; color: #333; margin-top: 12px; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1em; box-sizing: border-box; }
    .btn { display: inline-block; padding: 12px; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; width: 100%; margin-top: 12px; }
    .btn-primary { background: #0b3d5c; color: white; }
    .btn-success { background: #2e8b57; color: white; }
    .btn-danger { background: #c0392b; color: white; }
    .btn-warning { background: #e08a3e; color: white; }
    .btn-outline { background: transparent; border: 1px solid #0b3d5c; color: #0b3d5c; }
    .btn-sm { padding: 6px 12px; font-size: 0.82em; width: auto; margin-top: 0; }
    .error { color: #c0392b; font-size: 0.85em; margin-top: 8px; display: none; }
    #panel { display: none; padding: 12px; max-width: 600px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #0b3d5c; color: white; padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; }
    .header h2 { font-size: 1.1em; }
    .header button { background: rgba(255,255,255,0.15); border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.82em; cursor: pointer; }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 10px; text-align: center; border: none; border-radius: 8px 8px 0 0; background: #ddd; cursor: pointer; font-size: 0.9em; font-weight: 600; }
    .tab.active { background: #0b3d5c; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .card h3 { font-size: 1em; margin-bottom: 6px; }
    .card-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; padding: 3px 0; }
    .card-row span:first-child { color: #666; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.72em; font-weight: 600; }
    .badge-active { background: #d4edda; color: #155724; }
    .badge-expired { background: #f8d7da; color: #721c24; }
    .badge-trial { background: #fff3cd; color: #856404; }
    .badge-pending { background: #d1ecf1; color: #0c5460; }
    .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .actions .btn-sm { flex: 1; min-width: 80px; }
    .empty { text-align: center; color: #999; padding: 30px; font-size: 0.9em; }
    .loading { text-align: center; color: #666; padding: 20px; }
    .section-title { font-size: 0.9em; font-weight: 700; color: #0b3d5c; margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #0b3d5c; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .stat-box { background: white; border-radius: 10px; padding: 14px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .stat-box .num { font-size: 1.6em; font-weight: 700; color: #0b3d5c; }
    .stat-box .label { font-size: 0.75em; color: #666; margin-top: 2px; }
    .key-input { background: #fffde7; border: 1px solid #ffc107; }
    .key-hint { font-size: 0.78em; color: #666; margin-top: 4px; }
    .key-hint a { color: #0b3d5c; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 8px; font-size: 0.9em; z-index: 9999; opacity: 0; transition: opacity 0.3s; }
    .toast.show { opacity: 1; }
    .toast.success { background: #2e8b57; }
    .toast.error { background: #c0392b; }
  </style>
</head>
<body>
<div id="pantallaLogin">
  <div class="login-card">
    <h1>🔧 Panel Admin</h1>
    <p>Aguatero - Gestión de repartidores</p>
    <label>Service Role Key (de Supabase)</label>
    <input type="password" id="inputServiceKey" class="key-input" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ...">
    <div class="key-hint">Necesaria para crear/eliminar usuarios. Obtenela en: <a href="https://supabase.com/dashboard" target="_blank">Supabase → Settings → API → service_role</a>. Solo se guarda en esta sesión.</div>
    <label>Tu email (admin)</label>
    <input type="email" id="loginEmail" placeholder="tu@email.com">
    <label>Tu contraseña</label>
    <input type="password" id="loginPassword" placeholder="••••••••">
    <div class="error" id="loginError"></div>
    <button class="btn btn-primary" id="btnLogin" onclick="hacerLogin()">Ingresar</button>
  </div>
</div>
<div id="panel">
  <div class="header">
    <h2>🔧 Panel Admin</h2>
    <button onclick="cerrarSesion()">Salir</button>
  </div>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="tabs">
    <button class="tab active" onclick="cambiarTab('usuarios')">👥 Repartidores</button>
    <button class="tab" onclick="cambiarTab('crear')">➕ Nuevo</button>
    <button class="tab" onclick="cambiarTab('membresias')">💳 Membresías</button>
  </div>
  <div class="tab-content active" id="tab-usuarios">
    <div class="section-title">Repartidores registrados</div>
    <div id="listaUsuarios" class="loading">Cargando...</div>
  </div>
  <div class="tab-content" id="tab-crear">
    <div class="card">
      <div class="section-title">Crear nuevo repartidor</div>
      <label>Nombre (opcional)</label>
      <input type="text" id="nuevoNombre" placeholder="Ej: Carlos">
      <label>Email</label>
      <input type="email" id="nuevoEmail" placeholder="repartidor@email.com">
      <label>Contraseña</label>
      <input type="text" id="nuevoPassword" placeholder="Mínimo 6 caracteres">
      <label>Días de membresía gratis</label>
      <select id="nuevoDiasGratis">
        <option value="30">30 días (1 mes)</option>
        <option value="15">15 días</option>
        <option value="7">7 días</option>
        <option value="0">Sin membresía (trial)</option>
      </select>
      <button class="btn btn-success" id="btnCrearUser" onclick="crearUsuario()">Crear repartidor</button>
    </div>
  </div>
  <div class="tab-content" id="tab-membresias">
    <div class="section-title">Estado de membresías</div>
    <div id="listaMembresias" class="loading">Cargando...</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const SUPABASE_URL='https://gpchmuhxqmpwjrrtbsgr.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwY2htdWh4cW1wd2pycnRic2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyODcyMjQsImV4cCI6MjEwMDg2MzIyNH0.9KQksogtzzhb9uzdAAdHOmuNWnMTHa0PUMR3wDJCgG4';
let sb=null,serviceKey='',currentUser=null;

function hacerLogin(){
  var email=document.getElementById('loginEmail').value.trim();
  var password=document.getElementById('loginPassword').value;
  serviceKey=document.getElementById('inputServiceKey').value.trim();
  if(!email||!password){mostrarError('Completá email y contraseña');return;}
  var btn=document.getElementById('btnLogin');btn.disabled=true;btn.textContent='Ingresando...';
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.signInWithPassword({email:email,password:password}).then(function(result){
    if(result.error){mostrarError('Email o contraseña incorrectos');btn.disabled=false;btn.textContent='Ingresar';return;}
    currentUser=result.data.user;
    document.getElementById('pantallaLogin').style.display='none';
    document.getElementById('panel').style.display='block';
    cargarTodo();
  }).catch(function(e){mostrarError('No se pudo conectar: '+(e.message||'error'));btn.disabled=false;btn.textContent='Ingresar';});
}
function mostrarError(msg){var el=document.getElementById('loginError');el.textContent=msg;el.style.display='block';el.style.color='#c0392b';}
function toast(msg,type){var el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+(type||'');setTimeout(function(){el.classList.remove('show');},3000);}

function cambiarTab(tab){
  document.querySelectorAll('.tab-content').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.getElementById('tab-'+tab).classList.add('active');
  if(event)event.target.classList.add('active');
  if(tab==='usuarios')cargarUsuarios();
  if(tab==='membresias')cargarMembresias();
}

async function adminApi(path,method,body){
  var url=SUPABASE_URL+path;
  var headers={'apikey':serviceKey||SUPABASE_ANON_KEY,'Content-Type':'application/json'};
  if(serviceKey)headers['Authorization']='Bearer '+serviceKey;
  var opts={method:method||'GET',headers:headers};
  if(body)opts.body=JSON.stringify(body);
  var res=await fetch(url,opts);
  return await res.json();
}

async function cargarUsuarios(){
  var cont=document.getElementById('listaUsuarios');cont.innerHTML='<div class="loading">Cargando...</div>';
  try{
    var users=await adminApi('/auth/v1/admin/users','GET');
    if(users.error){cont.innerHTML='<div class="empty">Necesitás la service key para ver usuarios</div>';return;}
    if(!Array.isArray(users))users=[users];
    var membresias={};
    try{var subs=await adminApi('/rest/v1/suscripciones?select=*','GET');if(Array.isArray(subs))subs.forEach(function(s){membresias[s.user_id]=s;});}catch(e){}
    var html='',activos=0,vencidos=0,trial=0;
    users.forEach(function(u){
      var sub=membresias[u.id];
      var estadoBadge='<span class="badge badge-trial">Trial</span>',vencimientoTxt='Sin membresía';
      if(sub){
        var vencida=sub.estado==='vencida'||(sub.fecha_vencimiento&&new Date(sub.fecha_vencimiento)<new Date());
        if(vencida){estadoBadge='<span class="badge badge-expired">Vencida</span>';vencidos++;}
        else{estadoBadge='<span class="badge badge-active">Activa</span>';activos++;}
        vencimientoTxt=sub.fecha_vencimiento?new Date(sub.fecha_vencimiento).toLocaleDateString('es-AR'):'N/A';
      }else{trial++;}
      var emailOk=u.email_confirmed_at?'<span class="badge badge-active">Confirmado</span>':'<span class="badge badge-pending">Sin confirmar</span>';
      var nombre=(u.user_metadata&&u.user_metadata.nombre_marca)||'Sin nombre';
      html+='<div class="card"><h3>'+esc(nombre)+' <span style="font-size:0.8em;color:#666;">('+esc(u.email)+')</span></h3>'+
        '<div class="card-row"><span>Estado:</span><span>'+estadoBadge+'</span></div>'+
        '<div class="card-row"><span>Email:</span><span>'+emailOk+'</span></div>'+
        '<div class="card-row"><span>Vencimiento:</span><span>'+vencimientoTxt+'</span></div>'+
        '<div class="card-row"><span>Creado:</span><span>'+new Date(u.created_at).toLocaleDateString('es-AR')+'</span></div>'+
        '<div class="actions">'+
        (u.email_confirmed_at?'':'<button class="btn-sm btn-success" onclick="confirmarEmail(\''+u.id+'\')">Confirmar email</button>')+
        '<button class="btn-sm btn-outline" onclick="activarMembresia(\''+u.id+'\',30)">+30 días</button>'+
        '<button class="btn-sm btn-outline" onclick="activarMembresia(\''+u.id+'\',7)">+7 días</button>'+
        '<button class="btn-sm btn-warning" onclick="activarMembresia(\''+u.id+'\',365)">+1 año</button></div></div>';
    });
    if(html==='')html='<div class="empty">No hay repartidores</div>';
    cont.innerHTML=html;
    document.getElementById('statsGrid').innerHTML=
      '<div class="stat-box"><div class="num">'+users.length+'</div><div class="label">Total</div></div>'+
      '<div class="stat-box"><div class="num" style="color:#2e8b57;">'+activos+'</div><div class="label">Activas</div></div>'+
      '<div class="stat-box"><div class="num" style="color:#c0392b;">'+vencidos+'</div><div class="label">Vencidas</div></div>'+
      '<div class="stat-box"><div class="num" style="color:#e08a3e;">'+trial+'</div><div class="label">Trial</div></div>';
  }catch(e){cont.innerHTML='<div class="empty">Error: '+(e.message||'')+'</div>';}
}

async function confirmarEmail(userId){
  if(!serviceKey){toast('Necesitás la service key','error');return;}
  try{
    var res=await fetch(SUPABASE_URL+'/auth/v1/admin/users/'+userId,{method:'PUT',headers:{'apikey':serviceKey,'Authorization':'Bearer '+serviceKey,'Content-Type':'application/json'},body:JSON.stringify({email_confirm:true})});
    var data=await res.json();
    if(data.error){toast('Error: '+(data.error.message||data.msg),'error');return;}
    toast('Email confirmado','success');cargarUsuarios();
  }catch(e){toast('Error: '+(e.message||''),'error');}
}

async function crearUsuario(){
  var nombre=document.getElementById('nuevoNombre').value.trim();
  var email=document.getElementById('nuevoEmail').value.trim();
  var password=document.getElementById('nuevoPassword').value;
  var diasGratis=parseInt(document.getElementById('nuevoDiasGratis').value);
  if(!email||!password){toast('Falta email o contraseña','error');return;}
  if(password.length<6){toast('Mínimo 6 caracteres','error');return;}
  if(!serviceKey){toast('Necesitás la service key','error');return;}
  var btn=document.getElementById('btnCrearUser');btn.disabled=true;btn.textContent='Creando...';
  try{
    var res=await fetch(SUPABASE_URL+'/auth/v1/admin/users',{method:'POST',headers:{'apikey':serviceKey,'Authorization':'Bearer '+serviceKey,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:password,email_confirm:true,user_metadata:{nombre_marca:nombre||'Repartidor'}})});
    var data=await res.json();
    if(data.error||data.code){toast('Error: '+(data.error?data.error.message:data.msg||''),'error');btn.disabled=false;btn.textContent='Crear repartidor';return;}
    var userId=data.id;
    toast('Repartidor creado: '+email,'success');
    if(diasGratis>0&&userId){
      var venc=new Date();venc.setDate(venc.getDate()+diasGratis);
      await fetch(SUPABASE_URL+'/rest/v1/suscripciones',{method:'POST',headers:{'apikey':serviceKey,'Authorization':'Bearer '+serviceKey,'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,estado:'activa',fecha_vencimiento:venc.toISOString()})});
      toast('Membresía '+diasGratis+' días asignada','success');
    }
    document.getElementById('nuevoNombre').value='';document.getElementById('nuevoEmail').value='';document.getElementById('nuevoPassword').value='';
    cargarUsuarios();btn.disabled=false;btn.textContent='Crear repartidor';
  }catch(e){toast('Error: '+(e.message||''),'error');btn.disabled=false;btn.textContent='Crear repartidor';}
}

async function activarMembresia(userId,dias){
  if(!serviceKey){toast('Necesitás la service key','error');return;}
  try{
    var existing=await adminApi('/rest/v1/suscripciones?user_id=eq.'+userId+'&select=*','GET');
    var fechaBase=new Date();
    if(Array.isArray(existing)&&existing.length>0&&existing[0].fecha_vencimiento){
      var vencActual=new Date(existing[0].fecha_vencimiento);
      if(vencActual>new Date())fechaBase=vencActual;
    }
    fechaBase.setDate(fechaBase.getDate()+dias);
    if(Array.isArray(existing)&&existing.length>0){
      await fetch(SUPABASE_URL+'/rest/v1/suscripciones?user_id=eq.'+userId,{method:'PATCH',headers:{'apikey':serviceKey,'Authorization':'Bearer '+serviceKey,'Content-Type':'application/json'},body:JSON.stringify({estado:'activa',fecha_vencimiento:fechaBase.toISOString()})});
    }else{
      await fetch(SUPABASE_URL+'/rest/v1/suscripciones',{method:'POST',headers:{'apikey':serviceKey,'Authorization':'Bearer '+serviceKey,'Content-Type':'application/json'},body:JSON.stringify({user_id:userId,estado:'activa',fecha_vencimiento:fechaBase.toISOString()})});
    }
    toast('+'+dias+' días (vence '+fechaBase.toLocaleDateString('es-AR')+')','success');
    cargarUsuarios();cargarMembresias();
  }catch(e){toast('Error: '+(e.message||''),'error');}
}

async function cargarMembresias(){
  var cont=document.getElementById('listaMembresias');cont.innerHTML='<div class="loading">Cargando...</div>';
  try{
    var subs=await adminApi('/rest/v1/suscripciones?select=*&order=fecha_vencimiento.asc','GET');
    if(subs.error||!Array.isArray(subs)||subs.length===0){cont.innerHTML='<div class="empty">No hay membresías</div>';return;}
    var html='';
    subs.forEach(function(s){
      var venc=s.fecha_vencimiento?new Date(s.fecha_vencimiento):null;
      var vencida=s.estado==='vencida'||(venc&&venc<new Date());
      var diasRest=venc?Math.ceil((venc-new Date())/86400000):null;
      var badge=vencida?'<span class="badge badge-expired">Vencida</span>':'<span class="badge badge-active">Activa</span>';
      var diasTxt=vencida?'Venció '+(venc?venc.toLocaleDateString('es-AR'):''):'Vence en '+diasRest+' días ('+(venc?venc.toLocaleDateString('es-AR'):'')+')';
      html+='<div class="card"><div class="card-row"><span>Usuario:</span><span>'+s.user_id.substring(0,8)+'...</span></div><div class="card-row"><span>Estado:</span><span>'+badge+'</span></div><div class="card-row"><span>'+diasTxt+'</span></div><div class="actions"><button class="btn-sm btn-outline" onclick="activarMembresia(\''+s.user_id+'\',30)">+30 días</button><button class="btn-sm btn-outline" onclick="activarMembresia(\''+s.user_id+'\',7)">+7 días</button><button class="btn-sm btn-danger" onclick="revocarMembresia(\''+s.user_id+'\')">Revocar</button></div></div>';
    });
    cont.innerHTML=html;
  }catch(e){cont.innerHTML='<div class="empty">Error: '+(e.message||'')+'</div>';}
}

async function revocarMembresia(userId){
  if(!confirm('¿Revocar membresía? Se bloquea el acceso.'))return;
  try{
    await fetch(SUPABASE_URL+'/rest/v1/suscripciones?user_id=eq.'+userId,{method:'PATCH',headers:{'apikey':serviceKey,'Authorization':'Bearer '+serviceKey,'Content-Type':'application/json'},body:JSON.stringify({estado:'vencida'})});
    toast('Membresía revocada','success');cargarMembresias();cargarUsuarios();
  }catch(e){toast('Error: '+(e.message||''),'error');}
}

function cargarTodo(){cargarUsuarios();}
async function cerrarSesion(){if(sb)await sb.auth.signOut();serviceKey='';currentUser=null;document.getElementById('panel').style.display='none';document.getElementById('pantallaLogin').style.display='flex';document.getElementById('loginEmail').value='';document.getElementById('loginPassword').value='';document.getElementById('inputServiceKey').value='';}
function esc(str){if(!str)return'';return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
