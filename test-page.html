    signInWithPassword: async function() { return { data: {}, error: null }; },

  },
  from: function(table) {
    return {
      select: function() { return { eq: function() { return { maybeSingle: async function() { return { data: null }; } }; } }; },
      upsert: async function() { return { error: null }; },
      delete: async function() { return { eq: async function() { return { error: null }; } }; }
    };
  }
};
window.supabase = { createClient: function() { return window.sb; } };
</script>
